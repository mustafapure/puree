name: Fetch render assets

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated list of asset URLs to download"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/child-hero-marketing-video-e95a23
      - name: Download assets
        run: |
          mkdir -p marketing-video/renders
          for url in ${{ inputs.urls }}; do
            fname=$(basename "${url%%\?*}")
            echo "Fetching $fname"
            curl -sSL --fail --max-time 300 -o "marketing-video/renders/$fname" "$url"
          done
          ls -la marketing-video/renders
      - name: Commit and push
        run: |
          git config user.name "render-fetch-bot"
          git config user.email "actions@github.com"
          git add marketing-video/renders
          git diff --cached --quiet || git commit -m "Fetch render assets"
          git push
